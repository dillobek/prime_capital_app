name: prime_capital_mobile
description: "Prime Capital — mijozlar uchun mobil ilova (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  # Premium fintech-style typography (Plus Jakarta Sans) — see buildPrimeTheme() in core/constants.dart.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
